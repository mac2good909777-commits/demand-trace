<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求軌跡監控 — 睦聚工業地產</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1c2430; --muted:#61708a; --line:#e3e7ee;
  --accent:#0f6b5c; --accent-soft:#e3f1ee;
  --a:#b3261e; --a-soft:#fbe9e7; --b:#8a5a00; --b-soft:#fff3d6; --c:#3b5b92; --c-soft:#e8eefb;
  --sell:#8a2be2; --sell-soft:#f1e8fb; --buy:#0b6bcb; --buy-soft:#e6f0fb;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12161c; --card:#1a2029; --ink:#e8edf4; --muted:#94a3b8; --line:#2a3340;
    --accent:#4fd1b5; --accent-soft:#123f36;
    --a:#ff8a80; --a-soft:#3a1f1d; --b:#ffd54f; --b-soft:#3a2f10; --c:#90b4f0; --c-soft:#1c2a44;
    --sell:#c9a2f5; --sell-soft:#2c1f42; --buy:#8ec2f5; --buy-soft:#16283c; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
header{padding:26px 20px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.wrap{max-width:1020px;margin:0 auto}
h1{font-size:1.4rem;letter-spacing:.05em}
h1 small{font-size:.85rem;color:var(--muted);font-weight:400;margin-left:.6em}
.sub{color:var(--muted);font-size:.86rem;margin-top:3px}
nav.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 16px;border-radius:20px;cursor:pointer;font-size:.9rem}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .n{font-size:1.7rem;font-weight:700}
.kpi .t{color:var(--muted);font-size:.8rem;margin-top:2px}
.kpi.hot .n{color:var(--a)} .kpi.buy .n{color:var(--buy)} .kpi.sell .n{color:var(--sell)}
h2.sec{font-size:1rem;color:var(--muted);margin:20px 0 10px;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:12px}
.card .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.co{font-weight:700;font-size:1.02rem}
.tick{color:var(--muted);font-size:.84rem}
.badge{font-size:.74rem;padding:2px 10px;border-radius:12px;white-space:nowrap}
.badge.type{background:var(--accent-soft);color:var(--accent)}
.badge.pA{background:var(--a-soft);color:var(--a)}
.badge.pB{background:var(--b-soft);color:var(--b)}
.badge.pC{background:var(--c-soft);color:var(--c)}
.badge.sell{background:var(--sell-soft);color:var(--sell)}
.badge.buy{background:var(--buy-soft);color:var(--buy)}
.badge.line{background:transparent;border:1px solid var(--line);color:var(--muted)}
.date{color:var(--muted);font-size:.8rem;margin-left:auto}
.sec2{margin-top:7px;font-size:.9rem}
.sec2 b{color:var(--muted);font-weight:600;font-size:.78rem;display:block;margin-bottom:1px}
.src a{color:var(--accent);word-break:break-all;text-decoration:none;border-bottom:1px dotted var(--accent)}
.src span{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:.88rem}
.rank{display:flex;align-items:center;gap:10px}
.rank .num{font-size:1.1rem;font-weight:800;color:var(--muted);min-width:1.6em;text-align:center}
.scorebar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:80px;max-width:200px}
.scorebar i{display:block;height:100%;border-radius:4px}
.p高 i{background:var(--a)} .p中 i{background:var(--b)} .p低 i{background:var(--c)}
.scoretxt{font-weight:700;font-size:.95rem;min-width:3.2em}
.t高{color:var(--a)} .t中{color:var(--b)} .t低{color:var(--c)}
.prog{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.prog b{color:var(--muted);font-weight:600;font-size:.78rem;display:block;margin-bottom:4px}
.chip{display:inline-block;font-size:.76rem;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:1px 9px;margin:0 4px 4px 0}
.chip small{color:var(--muted)}
.chip .del{cursor:pointer;margin-left:5px;color:var(--muted);font-weight:700}
.chip .del:hover{color:var(--a)}
.pform{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.pform select,.pform input{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.84rem}
.pform input{flex:1;min-width:140px}
.pform button{padding:5px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:.84rem}
.pform button:disabled{opacity:.5}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wgrid .card{cursor:pointer;transition:transform .1s;margin:0}
.wgrid .card:hover{transform:translateY(-2px)}
.wgrid .r{color:var(--muted);font-size:.84rem;margin-top:4px}
#mdView{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 28px}
#mdView h1{font-size:1.25rem;margin-bottom:12px}
#mdView h2{font-size:1.02rem;margin:18px 0 8px;color:var(--accent)}
#mdView table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.87rem;display:block;overflow-x:auto}
#mdView th,#mdView td{border:1px solid var(--line);padding:6px 10px;text-align:left}
#mdView blockquote{border-left:3px solid var(--accent);padding:6px 14px;margin:8px 0;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.88rem}
#mdView a{color:var(--accent)}
.back{display:inline-block;margin-bottom:12px;color:var(--accent);cursor:pointer;font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:.76rem;text-align:center;padding:24px 0 40px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>需求軌跡監控<small>購置・處分・產業鏈切入點</small></h1>
  <div class="sub">未來12個月需求機率權重排序｜每日 03:00 自動更新｜監控範圍：台中・彰化・南投・苗栗・雲林・嘉義</div>
  <nav class="tabs">
    <button id="tab0" class="on" onclick="show(0)">總覽（權重排序）</button>
    <button id="tab1" onclick="show(1)">事件時間軸</button>
    <button id="tab2" onclick="show(2)">公司軌跡檔</button>
  </nav>
</div></header>
<main><div class="wrap">

<section id="view0">
  <div class="kpis" id="kpis"></div>
  <h2 class="sec">📊 監控公司排序（依未來12個月需求機率）</h2>
  <div id="ranking"></div>
  <h2 class="sec">🕐 最新事件</h2>
  <div id="latest"></div>
</section>

<section id="view1" style="display:none">
  <div class="filters">
    <select id="fCo"><option value="">全部公司</option></select>
    <select id="fPr"><option value="">全部優先級</option><option>A-立即接觸</option><option>B-三個月內</option><option>C-持續觀察</option></select>
    <select id="fTy"><option value="">全部事件類型</option></select>
  </div>
  <div id="list"></div>
</section>

<section id="view2" style="display:none">
  <div class="wgrid" id="wgrid"></div>
  <div id="mdWrap" style="display:none">
    <span class="back" onclick="closeMd()">← 回公司列表</span>
    <div id="mdView"></div>
    <div class="card" id="mdProg" style="margin-top:12px"></div>
  </div>
</section>

</div></main>
<footer>資料來源：公開資訊觀測站重大訊息、新聞、內政部實價登錄｜經營進度同步至 Google 試算表｜睦聚工業地產</footer>
<script>
const EP='https://script.google.com/macros/s/AKfycbzmlpV1fpt1RWxVwZj8teUHWw4fs4zpix_3JqCVGX4SeMPIp5Di6_6m_YDRZn4fBQ4/exec';
const ACT_GROUPS=[
 ['開發接觸',['寄發開發信','電訪','已聯繫上','拜訪','已約訪']],
 ['購置經營（幫它找）',['確認購置需求','提供物件','帶看物件','出價斡旋','購置成案']],
 ['出售經營（幫它賣）',['確認處分需求','爭取委託','已取得委託','整理銷售資料','推廣曝光','帶買方看廠','買方出價/斡旋','出售成案']],
 ['其他',['委託洽談','暫停追蹤']]
];
let RECS=[],WATCH=[],PROG=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pCls=p=>p&&p.startsWith('A')?'pA':p&&p.startsWith('B')?'pB':'pC';
const kindCls=t=>/處分|收縮/.test(t||'')?'sell':/取得|擴產/.test(t||'')?'buy':'line';
function linkify(s){
  return esc(s).split(/\s*;\s*|\s*；\s*/).map(part=>{
    const m=part.match(/https?:\/\/\S+/);
    if(m){const u=m[0];return part.replace(u,`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);}
    return `<span>${part}</span>`;
  }).join('<br>');
}
function progChips(co,limit){
  const rows=PROG.filter(p=>p[1]===co).slice(-limit);
  return rows.length?rows.map(p=>`<span class="chip">${esc(p[2])}${p[3]?'·'+esc(p[3]):''} <small>${esc(String(p[0]).slice(5,10))}</small><a class="del" title="刪除" onclick="delProg('${esc(p[0])}','${esc(co)}','${esc(p[2])}',this)">✕</a></span>`).join(''):'<span class="chip" style="background:transparent;border:1px dashed var(--line);color:var(--muted)">尚無紀錄</span>';
}
function latestBadge(co){
  const rows=PROG.filter(p=>p[1]===co);
  if(!rows.length) return '';
  const p=rows[rows.length-1];
  return `<span class="badge type" title="最新經營進度">📌 ${esc(p[2])} <small style="opacity:.7">${esc(String(p[0]).slice(5,10))}</small></span>`;
}
async function delProg(time,co,act,el){
  if(!confirm(`刪除進度：${co}｜${act}｜${time}？`))return;
  el.textContent='…';
  const body=JSON.stringify({token:'muju-trace-2026',action:'progress_del',time,company:co,act});
  try{
    const r=await fetch(EP,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}).then(r=>r.json());
    if(r.ok){await loadProg();renderAll();}else alert('刪除失敗：'+(r.error||''));
  }catch(e){alert('連線失敗');}
}
function progForm(co,id){
  return `<div class="pform">
    <select id="act_${id}" onchange="saveProg('${esc(co)}','${id}',this)">
      <option value="">＋點選動作即儲存…</option>
      ${ACT_GROUPS.map(([g,acts])=>`<optgroup label="${g}">${acts.map(a=>`<option>${a}</option>`).join('')}</optgroup>`).join('')}
    </select>
    <input id="note_${id}" placeholder="備註（選填，先填再點選動作會一併儲存）">
    <span id="st_${id}" style="font-size:.8rem;color:var(--muted);align-self:center"></span>
  </div>`;
}
async function saveProg(co,id,sel){
  const act=sel.value; if(!act) return;
  const st=document.getElementById('st_'+id);
  sel.disabled=true; st.textContent='儲存中…';
  const body=JSON.stringify({token:'muju-trace-2026',action:'progress',company:co,
    act, note:document.getElementById('note_'+id).value});
  try{
    const r=await fetch(EP,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}).then(r=>r.json());
    if(r.ok){st.textContent='✅ 已儲存';await loadProg();renderAll();}
    else{st.textContent='❌ 失敗';sel.disabled=false;}
  }catch(e){st.textContent='❌ 連線失敗';sel.disabled=false;}
}
async function loadProg(){
  try{PROG=(await fetch(EP+'?list=progress&t='+Date.now()).then(r=>r.json())).progress||[];}catch(e){PROG=[];}
}
function recCard(r){return `
 <div class="card">
   <div class="top">
     <span class="co">${esc(r.company)}</span><span class="tick">${esc(r.ticker)}</span>
     <span class="badge ${kindCls(r.eventType)}">${esc(r.eventType)}</span>
     <span class="badge ${pCls(r.priority)}">${esc(r.priority)}</span>
     <span class="badge line">${esc(r.label)}</span>
     <span class="date">事件 ${esc(r.eventDate)}｜記錄 ${esc(r.recordDate)}</span>
   </div>
   <div class="sec2"><b>事件摘要</b>${esc(r.summary)}</div>
   <div class="sec2"><b>軌跡判讀</b>${esc(r.reading)}</div>
   <div class="sec2"><b>切入點</b>${esc(r.entry)}</div>
   ${r.related?`<div class="sec2"><b>關聯公司</b>${esc(r.related)}</div>`:''}
   <div class="sec2 src"><b>來源（點回原文自行判讀）</b>${linkify(r.sources)}</div>
 </div>`}
function renderRanking(){
  const ws=WATCH.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  ranking.innerHTML=ws.map((w,i)=>`
   <div class="card">
     <div class="top rank">
       <span class="num">${i+1}</span>
       <span class="co" style="cursor:pointer" onclick="show(2);openMd('${w.md}')">${esc(w.company)}</span>
       <span class="tick">${esc(w.ticker)}</span>
       <span class="badge ${w.tier==='A'?'pA':w.tier==='B'?'pB':'pC'}">${esc(w.tier)}級</span>
       <span class="scorebar p${w.prob}"><i style="width:${w.score||0}%"></i></span>
       <span class="scoretxt t${w.prob}">${w.score}分・${esc(w.prob)}</span>
       ${latestBadge(w.company)}
     </div>
     <div class="sec2"><b>訊號</b>${esc(w.reason)}</div>
     <div class="sec2"><b>經營建議</b>${esc(w.advice||'')}</div>
     <div class="prog"><b>經營進度</b>${progChips(w.company,4)}${progForm(w.company,'r'+i)}</div>
   </div>`).join('');
}
function renderTimeline(){
  const co=fCo.value,pr=fPr.value,ty=fTy.value;
  const rows=RECS.filter(r=>(!co||r.company===co)&&(!pr||r.priority===pr)&&(!ty||r.eventType===ty));
  list.innerHTML=rows.length?rows.map(recCard).join(''):'<div class="empty">無符合資料</div>';
}
function renderDash(){
  const nA=WATCH.filter(w=>w.tier==='A').length,nHigh=WATCH.filter(w=>w.prob==='高').length;
  const sell=RECS.filter(r=>/處分|收縮/.test(r.eventType)).length;
  const buy=RECS.filter(r=>/取得|擴產/.test(r.eventType)).length;
  const acted=new Set(PROG.map(p=>p[1])).size;
  kpis.innerHTML=`
   <div class="kpi"><div class="n">${WATCH.length}</div><div class="t">監控公司（A級 ${nA}）</div></div>
   <div class="kpi hot"><div class="n">${nHigh}</div><div class="t">高機率（12個月內）</div></div>
   <div class="kpi"><div class="n">${RECS.length}</div><div class="t">累積事件</div></div>
   <div class="kpi sell"><div class="n">${sell}</div><div class="t">處分/收縮訊號</div></div>
   <div class="kpi buy"><div class="n">${buy}</div><div class="t">取得/擴產訊號</div></div>
   <div class="kpi"><div class="n">${acted}</div><div class="t">已展開經營</div></div>`;
  latest.innerHTML=RECS.slice(0,3).map(recCard).join('')||'<div class="empty">尚無事件</div>';
}
function renderWgrid(){
  const ws=WATCH.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  wgrid.innerHTML=ws.map(w=>`
   <div class="card" onclick="openMd('${w.md}')">
     <div class="top"><span class="co">${esc(w.company)}</span><span class="tick">${esc(w.ticker)}</span>
     <span class="badge ${w.tier==='A'?'pA':'pB'}">${esc(w.tier)}級</span>
     <span class="scoretxt t${w.prob}" style="margin-left:auto">${w.score}分</span></div>
     <div style="margin-top:4px">${latestBadge(w.company)}</div>
     <div class="r">${esc(w.reason)}</div>
   </div>`).join('');
}
function renderAll(){renderRanking();renderDash();renderWgrid();}
function fill(sel,vals){[...new Set(vals)].forEach(v=>{const o=document.createElement('option');o.textContent=v;sel.appendChild(o);});}
Promise.all([
  fetch('data/records.json?'+Date.now()).then(r=>r.json()),
  fetch('data/watchlist.json?'+Date.now()).then(r=>r.json()).catch(()=>[]),
  loadProg()
]).then(([d,w])=>{
  RECS=d.slice().reverse(); WATCH=w;
  fill(fCo,RECS.map(r=>r.company)); fill(fTy,RECS.map(r=>r.eventType));
  [fCo,fPr,fTy].forEach(s=>s.onchange=renderTimeline);
  renderTimeline(); renderAll();
});
let CURCO='';
function openMd(f){
  const w=WATCH.find(x=>x.md===f); CURCO=w?w.company:'';
  fetch('companies/'+encodeURIComponent(f)+'?'+Date.now()).then(r=>r.text()).then(t=>{
    mdView.innerHTML=marked.parse(t);
    mdProg.innerHTML=`<div class="prog" style="border:none;padding:0"><b>經營進度（${esc(CURCO)}）</b>${progChips(CURCO,10)}${CURCO?progForm(CURCO,'md'):''}</div>`;
    wgrid.style.display='none';mdWrap.style.display='block';window.scrollTo(0,0);
  });
}
function closeMd(){mdWrap.style.display='none';wgrid.style.display='grid';}
function show(i){
  for(let k=0;k<3;k++){
    document.getElementById('view'+k).style.display=k===i?'block':'none';
    document.getElementById('tab'+k).classList.toggle('on',k===i);
  }
  if(i===2)closeMd();
}
</script>
</body>
</html>
